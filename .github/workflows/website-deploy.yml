name: website-deploy.yml
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: |
          COMMIT_TS=$(git show -s --format=%ct HEAD)
          DECK_UI_TS=$(git log -n 1 --format=%ct -- website/terminal-deck/index.html)
          DECK_UI_SHORT=$(git log -n 1 --format=%h -- website/terminal-deck/index.html)
          echo "$COMMIT_TS" > website/commit-timestamp.txt
          echo "${DECK_UI_TS:-$COMMIT_TS}" > website/terminal-deck/commit-timestamp.txt
          sed -i "s/__COMMIT_SHA__/$GITHUB_SHA/g; s/__COMMIT_SHORT__/${GITHUB_SHA::7}/g" website/index.html
          sed -i "s/__COMMIT_TIMESTAMP__/${DECK_UI_TS:-$COMMIT_TS}/g; s/__COMMIT_SHORT__/${DECK_UI_SHORT:-${GITHUB_SHA::7}}/g" website/terminal-deck/index.html
      - uses: google-github-actions/auth@v3
        with:
          service_account: brainfucksheetsgithubdeploy@youtube-355604.iam.gserviceaccount.com
          workload_identity_provider: projects/1074574117695/locations/global/workloadIdentityPools/brainfucksheet/providers/brainfucksheets
      - uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: 'website'
          destination: 'tbx-for-toolbox.dev'
          parent: false
