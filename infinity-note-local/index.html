<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Note (Local)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --bg-color: #1e1d27;
      --text-color: #eae8f2;
      --accent-color: #b294bb;
      --muted-color: #7c7694;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-message {
      color: var(--muted-color);
      font-size: 16px;
      font-weight: 500;
    }

    .error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      max-width: 400px;
    }

    .error-icon {
      color: #ef4444;
      margin-bottom: 15px;
    }

    .error-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-color);
      margin: 0 0 10px 0;
    }

    .error-message {
      color: var(--text-color);
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .retry-button {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--muted-color);
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-family);
    }

    .retry-button:hover {
      color: var(--accent-color);
      border-color: var(--accent-color);
      background: rgba(178, 148, 187, 0.1);
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div class="status-message">Connecting to GitHub...</div>
  </div>

  <div id="error" class="error-container">
    <svg class="error-icon" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
    <h2 class="error-title">Connection Failed</h2>
    <p class="error-message">Could not fetch Infinity Note. Please check your network connection or corporate proxy settings.</p>
    <button class="retry-button" onclick="fetchApp()">Retry Connection</button>
  </div>

  <script>
    const APP_URL = 'https://raw.githubusercontent.com/TarasMazepa/tbx-for-toolbox.dev/main/website/infinity-note/index.html';
    const BASE_URL = 'https://raw.githubusercontent.com/TarasMazepa/tbx-for-toolbox.dev/main/website/infinity-note/';

    async function fetchApp() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');

      loadingEl.style.display = 'flex';
      errorEl.style.display = 'none';

      try {
        const response = await fetch(APP_URL, { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        let html = await response.text();

        // Inject base tag into head
        const baseTag = `<base href="${BASE_URL}">`;

        // Find head tag to inject base tag right after it
        if (html.includes('<head>')) {
          html = html.replace('<head>', `<head>\n  ${baseTag}`);
        } else if (html.includes('<head ')) {
          // In case head has attributes
          html = html.replace(/(<head[^>]*>)/i, `$1\n  ${baseTag}`);
        } else {
          // If no head exists, prepend it (unlikely for a real HTML document)
          html = `<head>${baseTag}</head>\n` + html;
        }

        // Fade out
        loadingEl.style.opacity = '0';

        setTimeout(() => {
          // Write the fetched HTML
          document.open();
          document.write(html);
          document.close();
        }, 500);

      } catch (error) {
        console.error('Failed to fetch Infinity Note:', error);
        loadingEl.style.display = 'none';
        loadingEl.style.opacity = '1'; // Reset for next try
        errorEl.style.display = 'flex';
      }
    }

    // Start fetch immediately
    fetchApp();
  </script>
</body>
</html>
