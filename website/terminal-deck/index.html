  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🖥️</span>
      <h1>Terminal Spatial Remote</h1>
    </div>
    <div class="header-info">
      <div class="status-badge" id="wakeLockBadge" title="Screen Wake Lock status (prevents screen dimming)">
        <div class="status-dot online" id="wakeDot"></div>
        <span id="wakeText">Awake</span>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting</span>
      </div>
      <div class="status-badge" id="windowCount">0 windows</div>
      <button type="button" class="header-btn" id="hostsBtn" title="Saved API hosts">🔌 Hosts</button>
      <button type="button" class="header-btn" id="qrBtn" title="Show mobile QR code">📱 QR</button>
      <button type="button" class="header-btn" id="dockPosBtn" title="Move Enter dock (Edge / Bottom / Top / Left / Right / Inline)">◫ Edge</button>
      <button type="button" class="header-btn" id="fullscreenBtn" title="Toggle fullscreen">⛶ Full</button>
    </div>
  </header>

  <div class="version-banner" id="versionBanner" hidden>
    <span id="versionBannerText"></span>
    <div class="version-banner-actions">
      <button type="button" class="header-btn" id="versionRefreshBtn" hidden>↻ Refresh</button>
      <button type="button" class="header-btn" id="versionDismissBtn" title="Dismiss">✕</button>
    </div>
  </div>

  <button type="button" class="header-btn immersive-exit-btn" id="immersiveExitBtn" title="Exit fullscreen">✕ Exit</button>

  <main class="workspace-main" id="workspaceMain" data-dock="edge">
    <div class="viewport-container" id="viewportContainer">
      <div class="spatial-stage" id="spatialStage">
        <div class="empty-state">Looking for Terminal.app windows...</div>
      </div>
    </div>

    <div class="enter-dock" id="enterDock"></div>
  </main>
  <svg class="connector-layer" id="connectorLayer"></svg>

  <div class="qr-modal-backdrop" id="qrModal" hidden>
    <div class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
      <h2 id="qrModalTitle">📱 Open on Mobile</h2>
      <p>Scan this QR code with your phone camera on the same Wi-Fi to control your terminals:</p>
      <div class="qr-img-wrap">
        <img id="qrImg" alt="Mobile QR Code">
      </div>
      <div class="qr-url-row">
        <span id="qrUrlText">Loading...</span>
        <button type="button" class="header-btn" id="qrCopyBtn">Copy</button>
      </div>
      <button type="button" class="header-btn" id="qrCloseBtn">Continue on Desktop</button>
    </div>
  </div>

  <div class="qr-modal-backdrop" id="hostsModal" hidden>
    <div class="qr-modal hosts-modal" role="dialog" aria-modal="true" aria-labelledby="hostsModalTitle">
      <h2 id="hostsModalTitle">🔌 API Hosts</h2>
      <div class="hosts-summary" id="hostsSummary"></div>
      <div class="hosts-list" id="hostsList"></div>
      <div class="onboarding-host-row">
        <input type="text" class="onboarding-input" id="modalHostInput" placeholder="http://192.168.1.x:8999">
        <button type="button" class="header-btn" id="modalHostConnectBtn">Connect</button>
      </div>
      <div class="hosts-modal-footer">
        <button type="button" class="header-btn" id="hostsCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const FRONTEND_API_VERSION = 1;
    const HOSTS_STORAGE_KEY = 'terminal_deck_hosts';

    function normalizeHostUrl(raw) {
      const trimmed = (raw || '').trim();
      if (!trimmed) return '';
      const withScheme = (trimmed.startsWith('http://') || trimmed.startsWith('https://'))
        ? trimmed
        : `http://${trimmed}`;
      return withScheme.replace(/\/+$/, '');
    }

    function loadSavedHosts() {
      try {
        const raw = JSON.parse(localStorage.getItem(HOSTS_STORAGE_KEY) || '[]');
        if (!Array.isArray(raw)) return [];
        const seen = new Set();
        const hosts = [];
        for (const item of raw) {
          const url = normalizeHostUrl(typeof item === 'string' ? item : item && item.url);
          if (!url || seen.has(url)) continue;
          seen.add(url);
          hosts.push({
            url,
            hostname: item && typeof item.hostname === 'string' ? item.hostname : '',
            apiVersion: typeof (item && item.apiVersion) === 'number' ? item.apiVersion : null,
            lastConnectedAt: typeof (item && item.lastConnectedAt) === 'number' ? item.lastConnectedAt : 0,
          });
        }
        return hosts;
      } catch (e) {
        return [];
      }
    }

    function persistSavedHosts(hosts) {
      try {
        localStorage.setItem(HOSTS_STORAGE_KEY, JSON.stringify(hosts));
      } catch (e) {}
    }

    function saveHostEntry(rawUrl, meta = {}) {
      const url = normalizeHostUrl(rawUrl);
      if (!url) return;
      const hosts = loadSavedHosts();
      const idx = hosts.findIndex(h => h.url === url);
      const existing = idx >= 0 ? hosts[idx] : { url, hostname: '', apiVersion: null, lastConnectedAt: 0 };
      const updated = {
        url,
        hostname: meta.hostname !== undefined ? meta.hostname : existing.hostname,
        apiVersion: meta.apiVersion !== undefined ? meta.apiVersion : existing.apiVersion,
        lastConnectedAt: meta.lastConnectedAt !== undefined ? meta.lastConnectedAt : existing.lastConnectedAt,
      };
      if (idx >= 0) hosts.splice(idx, 1);
      hosts.unshift(updated);
      hosts.sort((a, b) => (b.lastConnectedAt || 0) - (a.lastConnectedAt || 0));
      persistSavedHosts(hosts);
    }

    function removeSavedHost(rawUrl) {
      const url = normalizeHostUrl(rawUrl);
      const hosts = loadSavedHosts().filter(h => h.url !== url);
      persistSavedHosts(hosts);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const hostParam = urlParams.get('host');
    if (hostParam) {
      const normalizedParam = normalizeHostUrl(hostParam);
      try { localStorage.setItem('terminal_deck_host', normalizedParam); } catch (e) {}
      saveHostEntry(normalizedParam);
    }
    const rawHost = hostParam || (() => {
      try { return localStorage.getItem('terminal_deck_host') || ''; } catch (e) { return ''; }
    })();
    const apiBase = rawHost
      ? normalizeHostUrl(rawHost)
      : (window.location.protocol === 'https:' ? 'http://localhost:8999' : '');

    function getEffectiveHostUrl() {
      return normalizeHostUrl(apiBase || window.location.origin);
    }

    let currentWindows = [];
    let currentDisplays = [];
    let isActionInProgress = false;
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const windowCount = document.getElementById('windowCount');
    const viewportContainer = document.getElementById('viewportContainer');
    const spatialStage = document.getElementById('spatialStage');
    const enterDock = document.getElementById('enterDock');
    const connectorLayer = document.getElementById('connectorLayer');
    const WINDOW_COLORS = ['#38bdf8', '#a78bfa', '#f472b6', '#34d399', '#fb923c', '#facc15', '#818cf8', '#2dd4bf'];
    let connectorTimer = null;
    const workspaceMain = document.getElementById('workspaceMain');
    const dockPosBtn = document.getElementById('dockPosBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const immersiveExitBtn = document.getElementById('immersiveExitBtn');

    const DOCK_POSITIONS = ['edge', 'bottom', 'top', 'left', 'right', 'inline'];
    const DOCK_LABELS = { bottom: '⬇ Bottom', top: '⬆ Top', left: '⬅ Left', right: '➡ Right', inline: '▣ Inline', edge: '◫ Edge' };
    let dockPos = (() => {
      try { return localStorage.getItem('tbx_dock_pos'); } catch (e) { return null; }
    })();
    if (!DOCK_POSITIONS.includes(dockPos)) dockPos = 'edge';

    function isPerWindowDock(pos) {
      return pos === 'inline' || pos === 'edge';
    }

    function applyDockPosition() {
      if (workspaceMain) workspaceMain.setAttribute('data-dock', dockPos);
      if (dockPosBtn) dockPosBtn.textContent = DOCK_LABELS[dockPos];
      if (typeof handleResize === 'function') {
        requestAnimationFrame(handleResize);
      }
    }
    applyDockPosition();

    if (dockPosBtn) {
      dockPosBtn.addEventListener('click', () => {
        triggerHaptic(20);
        dockPos = DOCK_POSITIONS[(DOCK_POSITIONS.indexOf(dockPos) + 1) % DOCK_POSITIONS.length];
        try { localStorage.setItem('tbx_dock_pos', dockPos); } catch (e) {}
        applyDockPosition();
      });
    }

    function isNativeFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFullscreenUI() {
      const active = isNativeFullscreen() || document.body.classList.contains('immersive');
      if (fullscreenBtn) {
        fullscreenBtn.classList.toggle('active', active);
        fullscreenBtn.textContent = active ? '✕ Exit' : '⛶ Full';
      }
      if (typeof handleResize === 'function') {
        requestAnimationFrame(handleResize);
      }
    }

    async function toggleFullscreen() {
      triggerHaptic(20);
      const root = document.documentElement;
      if (isNativeFullscreen()) {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } catch (e) {}
        document.body.classList.remove('immersive');
        updateFullscreenUI();
        return;
      }

      if (document.body.classList.contains('immersive')) {
        document.body.classList.remove('immersive');
        updateFullscreenUI();
        return;
      }

      if (root.requestFullscreen || root.webkitRequestFullscreen) {
        try {
          if (root.requestFullscreen) await root.requestFullscreen();
          else root.webkitRequestFullscreen();
          updateFullscreenUI();
          return;
        } catch (e) {}
      }

      // Fallback for browsers without Fullscreen API (e.g. iOS Safari)
      document.body.classList.add('immersive');
      updateFullscreenUI();
    }

    if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);
    if (immersiveExitBtn) immersiveExitBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    // Per-terminal Auto-Accept state (persisted in localStorage)
    let savedAutoAcceptIds = [];
    try {
      const rawIds = JSON.parse(localStorage.getItem('tbx_auto_accept_ids') || '[]');
      if (Array.isArray(rawIds)) savedAutoAcceptIds = rawIds.map(n => parseInt(n, 10)).filter(Boolean);
    } catch (e) {}
    const autoAcceptIds = new Set(savedAutoAcceptIds);
    const activeAutoAccepts = new Set();

    function saveAutoAcceptIds() {
      localStorage.setItem('tbx_auto_accept_ids', JSON.stringify([...autoAcceptIds]));
    }

    function toggleWindowAutoAccept(windowId) {
      const id = parseInt(windowId, 10);
      if (autoAcceptIds.has(id)) {
        autoAcceptIds.delete(id);
        activeAutoAccepts.delete(id);
      } else {
        autoAcceptIds.add(id);
      }
      saveAutoAcceptIds();
      triggerHaptic(40);
      if (currentWindows.length) {
        renderSpatialLayout(currentWindows, currentDisplays);
        checkAutoAccept(currentWindows);
      }
    }

    function attachEnterHandlers(btn, windowId) {
      let pressTimer = null;
      let longPressed = false;
      const clearPress = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };
      btn.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        longPressed = false;
        clearPress();
        pressTimer = setTimeout(() => {
          longPressed = true;
          pressTimer = null;
          toggleWindowAutoAccept(windowId);
        }, 450);
      });
      btn.addEventListener('pointerup', clearPress);
      btn.addEventListener('pointercancel', clearPress);
      btn.addEventListener('pointerleave', clearPress);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      btn.addEventListener('click', (e) => {
        if (longPressed) {
          e.preventDefault();
          longPressed = false;
          return;
        }
        sendAction(windowId, 'enter');
      });
    }

    function checkAutoAccept(windows) {
      windows.forEach(w => {
        if (!autoAcceptIds.has(w.id)) {
          activeAutoAccepts.delete(w.id);
          return;
        }
        const isActionRequired = w.agyState && w.agyState.actionRequired;
        if (isActionRequired) {
          if (!activeAutoAccepts.has(w.id)) {
            activeAutoAccepts.add(w.id);
            console.log('[⚡ Auto-Accept] Action required on window ' + w.id + ' (' + w.name + '). Scheduling Enter...');

            const enterBtn = enterDock ? enterDock.querySelector('.dock-enter-btn[data-id="' + w.id + '"] .dock-btn-action') : null;
            if (enterBtn) {
              enterBtn.textContent = '⚡ ACCEPTING...';
              enterBtn.parentElement.style.background = '#d97706';
            }
            const inlineBtn = spatialStage ? spatialStage.querySelector('.spatial-window[data-id="' + w.id + '"] .inline-enter-btn') : null;
            if (inlineBtn) {
              inlineBtn.textContent = '⚡ ACCEPTING...';
              inlineBtn.style.background = '#d97706';
            }

            // Settlement delay before auto-confirming (350ms)
            setTimeout(() => {
              if (!autoAcceptIds.has(w.id)) return;
              console.log('[⚡ Auto-Accept] Dispatched Enter to window ' + w.id);
              sendAction(w.id, 'enter');
            }, 350);
          }
        } else {
          activeAutoAccepts.delete(w.id);
        }
      });
    }

    // Haptics Helper
    function triggerHaptic(duration = 15) {
      if (navigator.vibrate) {
        try { navigator.vibrate(duration); } catch(e) {}
      }
    }

    // Robust Keep-Awake Engine (Screen Wake Lock API + NoSleep HTML5 Media Loop)
    let wakeLockSentinel = null;
    let isVideoAwakePlaying = false;
    const wakeDot = document.getElementById('wakeDot');
    const wakeText = document.getElementById('wakeText');
    const wakeBadge = document.getElementById('wakeLockBadge');

    // Create invisible looping video element
    const noSleepVideo = document.createElement('video');
    noSleepVideo.setAttribute('title', 'NoSleep');
    noSleepVideo.setAttribute('playsinline', '');
    noSleepVideo.setAttribute('webkit-playsinline', '');
    noSleepVideo.setAttribute('muted', '');
    noSleepVideo.muted = true;
    noSleepVideo.loop = true;
    noSleepVideo.style.position = 'fixed';
    noSleepVideo.style.width = '1px';
    noSleepVideo.style.height = '1px';
    noSleepVideo.style.opacity = '0.001';
    noSleepVideo.style.pointerEvents = 'none';
    noSleepVideo.style.bottom = '0';
    noSleepVideo.style.right = '0';

    const videoSource = document.createElement('source');
    videoSource.src = `${apiBase}/nosleep.mp4`;
    videoSource.type = 'video/mp4';
    noSleepVideo.appendChild(videoSource);
    document.body.appendChild(noSleepVideo);

    // iOS Safari continuous loop enforcement
    noSleepVideo.addEventListener('timeupdate', () => {
      if (noSleepVideo.currentTime > 0.5) {
        noSleepVideo.currentTime = Math.random() * 0.3;
      }
    });

    function updateWakeLockUI() {
      if (!wakeDot || !wakeText) return;
      const isActive = !!wakeLockSentinel || isVideoAwakePlaying;
      if (isActive) {
        wakeDot.className = 'status-dot online';
        wakeText.textContent = 'Awake';
        if (wakeBadge) wakeBadge.title = 'Screen Keep-Awake active (screen will not go dark)';
      } else {
        wakeDot.className = 'status-dot';
        wakeText.textContent = 'Tap for Awake';
        if (wakeBadge) wakeBadge.title = 'Screen Keep-Awake inactive. Tap anywhere or tap this badge.';
      }
    }

    async function enableKeepAwake() {
      // 1. Try native Screen Wake Lock API (works on HTTPS / localhost)
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLockSentinel || wakeLockSentinel.released) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              wakeLockSentinel = null;
              updateWakeLockUI();
              if (document.visibilityState === 'visible') {
                setTimeout(enableKeepAwake, 600);
              }
            });
          }
        } catch(e) {}
      }

      // 2. Play HTML5 Keep-Awake video (works over HTTP LAN on iOS Safari & Android)
      try {
        if (noSleepVideo.paused) {
          const p = noSleepVideo.play();
          if (p && typeof p.then === 'function') {
            await p;
          }
        }
        isVideoAwakePlaying = true;
      } catch(e) {
        isVideoAwakePlaying = !noSleepVideo.paused;
      }

      updateWakeLockUI();
    }

    // Try immediately on script run
    enableKeepAwake();

    // Re-arm on visibilitychange (e.g. phone wake up or switching back to browser)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        enableKeepAwake();
      }
    });

    // Re-arm on any user touch/tap anywhere on the screen
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evtType => {
      document.addEventListener(evtType, () => {
        enableKeepAwake();
      }, { passive: true });
    });

    if (wakeBadge) {
      wakeBadge.style.cursor = 'pointer';
      wakeBadge.addEventListener('click', () => {
        triggerHaptic(20);
        enableKeepAwake();
      });
    }

    // HTML Escape Helper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const keyDispatchState = new Map();

    function applyKeyDispatchUI(windowId) {
      const stage = keyDispatchState.get(windowId)?.stage || null;
      const card = spatialStage ? spatialStage.querySelector('.spatial-window[data-id="' + windowId + '"]') : null;
      if (card) {
        card.classList.remove('is-sending', 'is-sent', 'is-error');
        if (stage === 'sending' || stage === 'started') card.classList.add('is-sending');
        else if (stage === 'completed') card.classList.add('is-sent');
        else if (stage === 'error') card.classList.add('is-error');

        const inlineBtn = card.querySelector('.inline-enter-btn');
        if (inlineBtn) {
          const isAutoAccept = autoAcceptIds.has(windowId);
          inlineBtn.classList.toggle('auto-accept', isAutoAccept);
          inlineBtn.classList.remove('is-sending', 'is-sent', 'is-error');
          if (stage === 'sending' || stage === 'started') {
            inlineBtn.classList.add('is-sending');
            inlineBtn.textContent = stage === 'started' ? '⚡ Running...' : '⏳ Sending...';
          } else if (stage === 'completed') {
            inlineBtn.classList.add('is-sent');
            inlineBtn.textContent = '✓ Sent';
          } else if (stage === 'error') {
            inlineBtn.classList.add('is-error');
            inlineBtn.textContent = '✕ Failed';
          } else {
            inlineBtn.textContent = activeAutoAccepts.has(windowId)
              ? '⚡ ACCEPTING...'
              : (isAutoAccept ? '⚡ Auto' : '↵ Enter');
          }
        }
      }

      const btn = enterDock ? enterDock.querySelector('.dock-enter-btn[data-id="' + windowId + '"]') : null;
      if (btn) {
        const isAutoAccept = autoAcceptIds.has(windowId);
        btn.classList.toggle('auto-accept', isAutoAccept);
        btn.classList.remove('is-sending', 'is-sent', 'is-error');
        const actionEl = btn.querySelector('.dock-btn-action');
        if (stage === 'sending' || stage === 'started') {
          btn.classList.add('is-sending');
          if (actionEl) actionEl.textContent = stage === 'started' ? '⚡ Running...' : '⏳ Sending...';
        } else if (stage === 'completed') {
          btn.classList.add('is-sent');
          if (actionEl) actionEl.textContent = '✓ Sent';
        } else if (stage === 'error') {
          btn.classList.add('is-error');
          if (actionEl) actionEl.textContent = '✕ Failed';
        } else if (actionEl) {
          actionEl.textContent = activeAutoAccepts.has(windowId)
            ? '⚡ ACCEPTING...'
            : (isAutoAccept ? '⚡ ↵' : '↵');
        }
      }

      const path = connectorLayer ? connectorLayer.querySelector('path[data-id="' + windowId + '"]') : null;
      const dots = connectorLayer ? connectorLayer.querySelectorAll('circle[data-id="' + windowId + '"]') : [];
      if (path) {
        path.classList.toggle('connector-path-sending', stage === 'sending' || stage === 'started');
        let overrideColor = null;
        if (stage === 'sending' || stage === 'started') overrideColor = '#38bdf8';
        else if (stage === 'completed') overrideColor = '#4ade80';
        else if (stage === 'error') overrideColor = '#f87171';
        if (overrideColor) {
          path.setAttribute('stroke', overrideColor);
          path.setAttribute('stroke-width', '3');
          path.setAttribute('stroke-opacity', '1');
          dots.forEach(d => {
            d.setAttribute('fill', overrideColor);
            d.setAttribute('fill-opacity', '1');
          });
        }
      }
    }

    function setKeyDispatchStage(windowId, stage) {
      const id = parseInt(windowId, 10);
      const prev = keyDispatchState.get(id);
      if (prev && prev.timer) clearTimeout(prev.timer);

      if (!stage) {
        keyDispatchState.delete(id);
        applyKeyDispatchUI(id);
        return;
      }

      let timer = null;
      if (stage === 'completed' || stage === 'error') {
        if (stage === 'completed') {
          const win = currentWindows.find(w => w.id === id);
          if (win && win.agyState && win.agyState.actionRequired) {
            win.agyState.actionRequired = false;
            win.agyState.status = 'running';
            win.agyState.label = 'RUNNING';
            win.agyState.color = 'blue';
          }
        }
        timer = setTimeout(() => {
          keyDispatchState.delete(id);
          if (currentWindows.length) renderSpatialLayout(currentWindows, currentDisplays);
        }, stage === 'completed' ? 750 : 1200);
      } else {
        // Safety timeout in case server response/SSE is lost
        timer = setTimeout(() => {
          keyDispatchState.delete(id);
          if (currentWindows.length) renderSpatialLayout(currentWindows, currentDisplays);
        }, 4000);
      }

      keyDispatchState.set(id, { stage, timer });
      applyKeyDispatchUI(id);
    }

    // Send Key or Focus Action (with settlement debounce)
    async function sendAction(windowId, key) {
      if (isActionInProgress) return;
      isActionInProgress = true;
      const id = parseInt(windowId, 10);
      triggerHaptic(key === 'enter' ? 24 : 12);
      setKeyDispatchStage(id, 'sending');
      try {
        const res = await fetch(`${apiBase}/api/key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ windowId: id, key })
        });
        if (res.ok) {
          setKeyDispatchStage(id, 'completed');
        } else {
          setKeyDispatchStage(id, 'error');
        }
      } catch (err) {
        console.error('Failed to send key:', err);
        setKeyDispatchStage(id, 'error');
      } finally {
        setTimeout(() => { isActionInProgress = false; }, 160);
      }
    }

    function getShortWindowLabel(name) {
      if (!name) return 'Terminal';
      return name.split('—')[0].trim() || name;
    }

    function drawConnectors(windows, colorById) {
      if (!connectorLayer) return;
      connectorLayer.innerHTML = '';
      if (!windows || !windows.length || isPerWindowDock(dockPos)) return;

      const ns = 'http://www.w3.org/2000/svg';
      windows.forEach(w => {
        const card = spatialStage.querySelector('.spatial-window[data-id="' + w.id + '"] .window-card');
        const btn = enterDock ? enterDock.querySelector('.dock-enter-btn[data-id="' + w.id + '"]') : null;
        if (!card || !btn) return;

        const cRect = card.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (!cRect.width || !bRect.width) return;

        let x1, y1, x2, y2, cx1, cy1, cx2, cy2;
        if (dockPos === 'top') {
          x1 = cRect.left + cRect.width / 2;
          y1 = cRect.top;
          x2 = bRect.left + bRect.width / 2;
          y2 = bRect.bottom;
          const dy = Math.max(Math.abs(y1 - y2) * 0.5, 24);
          cx1 = x1; cy1 = y1 - dy; cx2 = x2; cy2 = y2 + dy;
        } else if (dockPos === 'left') {
          x1 = cRect.left;
          y1 = cRect.top + cRect.height / 2;
          x2 = bRect.right;
          y2 = bRect.top + bRect.height / 2;
          const dx = Math.max(Math.abs(x1 - x2) * 0.5, 24);
          cx1 = x1 - dx; cy1 = y1; cx2 = x2 + dx; cy2 = y2;
        } else if (dockPos === 'right') {
          x1 = cRect.right;
          y1 = cRect.top + cRect.height / 2;
          x2 = bRect.left;
          y2 = bRect.top + bRect.height / 2;
          const dx = Math.max(Math.abs(x2 - x1) * 0.5, 24);
          cx1 = x1 + dx; cy1 = y1; cx2 = x2 - dx; cy2 = y2;
        } else {
          x1 = cRect.left + cRect.width / 2;
          y1 = cRect.bottom;
          x2 = bRect.left + bRect.width / 2;
          y2 = bRect.top;
          const dy = Math.max(Math.abs(y2 - y1) * 0.5, 24);
          cx1 = x1; cy1 = y1 + dy; cx2 = x2; cy2 = y2 - dy;
        }
        const dispatchStage = keyDispatchState.get(w.id)?.stage || null;
        const isSending = dispatchStage === 'sending' || dispatchStage === 'started';
        const isActionRequired = w.agyState && w.agyState.actionRequired;
        let color = isActionRequired ? '#fbbf24' : (colorById.get(w.id) || '#38bdf8');
        if (isSending) color = '#38bdf8';
        else if (dispatchStage === 'completed') color = '#4ade80';
        else if (dispatchStage === 'error') color = '#f87171';

        const path = document.createElementNS(ns, 'path');
        path.setAttribute('data-id', w.id);
        path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + cx1 + ' ' + cy1 + ', ' + cx2 + ' ' + cy2 + ', ' + x2 + ' ' + y2);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', (isActionRequired || dispatchStage) ? '3' : '1.5');
        path.setAttribute('stroke-opacity', (isActionRequired || dispatchStage) ? '0.95' : '0.45');
        if (isSending) path.setAttribute('class', 'connector-path-sending');
        connectorLayer.appendChild(path);

        [[x1, y1], [x2, y2]].forEach(([cx, cy]) => {
          const dot = document.createElementNS(ns, 'circle');
          dot.setAttribute('data-id', w.id);
          dot.setAttribute('cx', cx);
          dot.setAttribute('cy', cy);
          dot.setAttribute('r', (isActionRequired || dispatchStage) ? '4' : '3');
          dot.setAttribute('fill', color);
          dot.setAttribute('fill-opacity', (isActionRequired || dispatchStage) ? '1' : '0.75');
          connectorLayer.appendChild(dot);
        });
      });
    }

    function scheduleConnectors(windows, colorById) {
      requestAnimationFrame(() => drawConnectors(windows, colorById));
      if (connectorTimer) clearTimeout(connectorTimer);
      connectorTimer = setTimeout(() => drawConnectors(windows, colorById), 320);
    }

    function renderEnterDock(sortedWindows, colorById) {
      if (!enterDock) return;
      if (!sortedWindows.length || isPerWindowDock(dockPos)) {
        enterDock.innerHTML = '';
        return;
      }

      const existingBtns = new Map();
      enterDock.querySelectorAll('.dock-enter-btn').forEach(el => {
        existingBtns.set(parseInt(el.getAttribute('data-id'), 10), el);
      });
      const currentIds = new Set(sortedWindows.map(w => w.id));
      for (const [id, el] of existingBtns) {
        if (!currentIds.has(id)) {
          el.remove();
          existingBtns.delete(id);
        }
      }

      sortedWindows.forEach((w, idx) => {
        const shortName = getShortWindowLabel(w.name);
        const isActionRequired = !!(w.agyState && w.agyState.actionRequired);
        const isAccepting = activeAutoAccepts.has(w.id);
        const color = colorById.get(w.id) || '#38bdf8';

        let btn = existingBtns.get(w.id);
        if (!btn) {
          btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('data-id', w.id);
          btn.className = 'dock-enter-btn';
          btn.innerHTML = '<span class="dock-btn-label"></span><span class="dock-btn-action">↵</span>';
          attachEnterHandlers(btn, w.id);
          enterDock.appendChild(btn);
        } else if (enterDock.children[idx] !== btn) {
          enterDock.insertBefore(btn, enterDock.children[idx] || null);
        }

        btn.style.setProperty('--win-color', color);
        const isAutoAccept = autoAcceptIds.has(w.id);
        const dispatchStage = keyDispatchState.get(w.id)?.stage || null;
        let btnClasses = 'dock-enter-btn';
        if (isAutoAccept) btnClasses += ' auto-accept';
        if (isActionRequired) btnClasses += ' action-required';
        if (dispatchStage === 'sending' || dispatchStage === 'started') btnClasses += ' is-sending';
        else if (dispatchStage === 'completed') btnClasses += ' is-sent';
        else if (dispatchStage === 'error') btnClasses += ' is-error';
        if (btn.className !== btnClasses) {
          btn.className = btnClasses;
        }
        btn.title = w.name + ' (long-press to toggle Auto-Accept)';
        const labelEl = btn.querySelector('.dock-btn-label');
        if (labelEl && labelEl.textContent !== shortName) {
          labelEl.textContent = shortName;
        }
        const actionEl = btn.querySelector('.dock-btn-action');
        if (actionEl) {
          if (dispatchStage === 'sending') actionEl.textContent = '⏳ Sending...';
          else if (dispatchStage === 'started') actionEl.textContent = '⚡ Running...';
          else if (dispatchStage === 'completed') actionEl.textContent = '✓ Sent';
          else if (dispatchStage === 'error') actionEl.textContent = '✕ Failed';
          else actionEl.textContent = isAccepting ? '⚡ ACCEPTING...' : (isAutoAccept ? '⚡ ↵' : '↵');
          btn.style.background = (!dispatchStage && isAccepting) ? '#d97706' : '';
        }
      });
    }

    // Render Full Spatial Desktop Layout with Ambient Lighting (Muted vs Lit)
    function renderSpatialLayout(windows, displays = []) {
      windowCount.textContent = windows.length + ' window' + (windows.length === 1 ? '' : 's');
      if (!windows.length) {
        spatialStage.innerHTML = '<div class="empty-state">No open Terminal.app windows found</div>';
        renderEnterDock([], new Map());
        drawConnectors([], new Map());
        return;
      }

      const isVerticalDock = dockPos === 'left' || dockPos === 'right';
      const sortedWindows = [...windows].sort((a, b) => {
        const ax = a.position.x + a.size.width / 2;
        const bx = b.position.x + b.size.width / 2;
        const ay = a.position.y + a.size.height / 2;
        const by = b.position.y + b.size.height / 2;
        if (isVerticalDock) {
          if (Math.abs(ay - by) > 40) return ay - by;
          return ax - bx;
        }
        if (Math.abs(ax - bx) > 40) return ax - bx;
        return ay - by;
      });
      const colorById = new Map();
      sortedWindows.forEach((w, idx) => {
        colorById.set(w.id, WINDOW_COLORS[idx % WINDOW_COLORS.length]);
      });

      // Remove empty state message if present
      const emptyState = spatialStage.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      // Compute global desktop bounding box from physical displays (if available) and windows
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      if (displays && displays.length > 0) {
        displays.forEach(d => {
          minX = Math.min(minX, d.x);
          minY = Math.min(minY, d.y);
          maxX = Math.max(maxX, d.x + d.width);
          maxY = Math.max(maxY, d.y + d.height);
        });
      }
      windows.forEach(w => {
        minX = Math.min(minX, w.position.x);
        minY = Math.min(minY, w.position.y);
        maxX = Math.max(maxX, w.position.x + w.size.width);
        maxY = Math.max(maxY, w.position.y + w.size.height);
      });

      const spanX = Math.max(maxX - minX, 100);
      const spanY = Math.max(maxY - minY, 100);

      // Measure exact available pixel dimensions inside viewportContainer
      const rect = viewportContainer.getBoundingClientRect();
      const padding = 8;
      const viewW = Math.max(rect.width - padding * 2, 40);
      const viewH = Math.max(rect.height - padding * 2, 40);

      // Stretch to fill the entire available viewport for maximum text readability
      spatialStage.style.width = Math.round(viewW) + 'px';
      spatialStage.style.height = Math.round(viewH) + 'px';

      // Render monitor outline layer behind windows when multiple displays exist
      let monitorsLayer = spatialStage.querySelector('.monitors-layer');
      if (!monitorsLayer) {
        monitorsLayer = document.createElement('div');
        monitorsLayer.className = 'monitors-layer';
        spatialStage.prepend(monitorsLayer);
      }
      monitorsLayer.innerHTML = '';
      if (displays && displays.length > 1) {
        displays.forEach((d, idx) => {
          const mLeft = ((d.x - minX) / spanX) * 100;
          const mTop = ((d.y - minY) / spanY) * 100;
          const mWidth = (d.width / spanX) * 100;
          const mHeight = (d.height / spanY) * 100;

          const panel = document.createElement('div');
          panel.className = 'monitor-panel';
          panel.style.left = mLeft + '%';
          panel.style.top = mTop + '%';
          panel.style.width = mWidth + '%';
          panel.style.height = mHeight + '%';
          panel.innerHTML = '<span class="monitor-label">Display ' + (idx + 1) + '</span>';
          monitorsLayer.appendChild(panel);
        });
      }

      // Index existing DOM cards by window ID
      const existingCards = new Map();
      spatialStage.querySelectorAll('.spatial-window').forEach(el => {
        const id = parseInt(el.getAttribute('data-id'), 10);
        existingCards.set(id, el);
      });

      const currentIds = new Set(windows.map(w => w.id));

      // Remove only cards for windows that truly closed
      for (const [id, el] of existingCards) {
        if (!currentIds.has(id)) {
          el.remove();
          existingCards.delete(id);
        }
      }

      function pickNearestEnterSide(leftPct, topPct, widthPct, heightPct) {
        const cardW = (widthPct / 100) * viewW;
        const cardH = (heightPct / 100) * viewH;
        const distTop = (topPct / 100) * viewH;
        const distBottom = ((100 - topPct - heightPct) / 100) * viewH;
        const distLeft = (leftPct / 100) * viewW;
        const distRight = ((100 - leftPct - widthPct) / 100) * viewW;

        if (Math.abs(cardW - cardH) < 1) {
          const sides = [
            ['top', distTop],
            ['bottom', distBottom],
            ['left', distLeft],
            ['right', distRight],
          ];
          sides.sort((a, b) => a[1] - b[1]);
          return sides[0][0];
        }
        if (cardH > cardW) {
          return distTop <= distBottom ? 'top' : 'bottom';
        }
        return distLeft <= distRight ? 'left' : 'right';
      }

      // Reconcile and update cards in place
      windows.forEach(w => {
        const leftPercent = ((w.position.x - minX) / spanX) * 100;
        const topPercent = ((w.position.y - minY) / spanY) * 100;
        const widthPercent = (w.size.width / spanX) * 100;
        const heightPercent = (w.size.height / spanY) * 100;
        const zIndex = 1000 - w.index;
        const isActive = w.index === 1;

        // Action detection state
        const agyStatus = w.agyState ? w.agyState.status : 'idle';
        const agyLabel = w.agyState ? w.agyState.label : '';
        const agyColor = w.agyState ? w.agyState.color : '';
        const isActionRequired = w.agyState && w.agyState.actionRequired;

        let card = existingCards.get(w.id);
        if (!card) {
          card = document.createElement('div');
          card.setAttribute('data-id', w.id);
          card.className = 'spatial-window';
          card.innerHTML = `
            <div class="window-card">
              <div class="window-content">
                <div class="card-header" onclick="sendAction(${w.id}, 'focus')">
                  <span class="window-color-dot"></span>
                  <div class="window-title" title="${escapeHtml(w.name)}">${escapeHtml(w.name)}</div>
                  <div class="header-badges">
                    <button type="button" class="card-auto-btn${autoAcceptIds.has(w.id) ? ' active' : ''}" title="Toggle Auto-Accept for this terminal" onclick="event.stopPropagation(); toggleWindowAutoAccept(${w.id})">⚡</button>
                    <span class="state-badge" style="display: none"></span>
                    <span class="active-badge" style="display: ${isActive ? 'inline-block' : 'none'}">ACTIVE</span>
                  </div>
                </div>

                <pre class="terminal-preview">${escapeHtml(w.preview || '')}</pre>
              </div>
              <button type="button" class="inline-enter-btn">↵ Enter</button>
            </div>
          `;
          const newInlineBtn = card.querySelector('.inline-enter-btn');
          if (newInlineBtn) attachEnterHandlers(newInlineBtn, w.id);
          spatialStage.appendChild(card);
        } else {
          // Update in-place without tearing down DOM
          const titleEl = card.querySelector('.window-title');
          if (titleEl && titleEl.textContent !== w.name) {
            titleEl.textContent = w.name;
            titleEl.title = w.name;
          }

          const activeBadge = card.querySelector('.active-badge');
          if (activeBadge) {
            activeBadge.style.display = isActive ? 'inline-block' : 'none';
          }

          const previewEl = card.querySelector('.terminal-preview');
          if (previewEl && previewEl.textContent !== (w.preview || '')) {
            previewEl.textContent = w.preview || '';
          }
        }

        card.setAttribute('data-enter-side', pickNearestEnterSide(leftPercent, topPercent, widthPercent, heightPercent));

        const autoBtn = card.querySelector('.card-auto-btn');
        if (autoBtn) {
          autoBtn.classList.toggle('active', autoAcceptIds.has(w.id));
        }

        const inlineBtn = card.querySelector('.inline-enter-btn');
        if (inlineBtn) {
          const isAutoAccept = autoAcceptIds.has(w.id);
          const stage = keyDispatchState.get(w.id)?.stage || null;
          inlineBtn.classList.toggle('auto-accept', isAutoAccept);
          inlineBtn.classList.remove('is-sending', 'is-sent', 'is-error');
          if (stage === 'sending' || stage === 'started') {
            inlineBtn.classList.add('is-sending');
            inlineBtn.textContent = stage === 'started' ? '⚡ Running...' : '⏳ Sending...';
          } else if (stage === 'completed') {
            inlineBtn.classList.add('is-sent');
            inlineBtn.textContent = '✓ Sent';
          } else if (stage === 'error') {
            inlineBtn.classList.add('is-error');
            inlineBtn.textContent = '✕ Failed';
          } else {
            const isAccepting = activeAutoAccepts.has(w.id);
            inlineBtn.textContent = isAccepting ? '⚡ ACCEPTING...' : (isAutoAccept ? '⚡ Auto' : '↵ Enter');
            inlineBtn.style.background = isAccepting ? '#d97706' : '';
          }
        }

        // Update State Badge
        const stateBadge = card.querySelector('.state-badge');
        if (stateBadge) {
          if (agyLabel) {
            stateBadge.textContent = agyLabel;
            stateBadge.className = 'state-badge badge-' + agyColor;
            stateBadge.style.display = 'inline-block';
          } else {
            stateBadge.style.display = 'none';
          }
        }

        // Update card classes (adds .action-required when snippet matches + key dispatch state)
        const dispatchStage = keyDispatchState.get(w.id)?.stage || null;
        let classNames = 'spatial-window';
        if (isActive) classNames += ' active';
        if (isActionRequired) classNames += ' action-required';
        if (dispatchStage === 'sending' || dispatchStage === 'started') classNames += ' is-sending';
        else if (dispatchStage === 'completed') classNames += ' is-sent';
        else if (dispatchStage === 'error') classNames += ' is-error';
        card.className = classNames;

        card.style.setProperty('--win-color', colorById.get(w.id) || '#38bdf8');
        card.style.left = leftPercent + '%';
        card.style.top = topPercent + '%';
        card.style.width = widthPercent + '%';
        card.style.height = heightPercent + '%';
        card.style.zIndex = isActionRequired ? 1001 : zIndex;
      });

      renderEnterDock(sortedWindows, colorById);
      scheduleConnectors(sortedWindows, colorById);
    }

    // Re-render on resize, orientation change, or fold/unfold
    function handleResize() {
      if (currentWindows.length) renderSpatialLayout(currentWindows, currentDisplays);
    }
    window.addEventListener('resize', handleResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleResize);
    }

    // Connect Server-Sent Events (SSE)
    let hasConnectedOnce = false;
    let isSseConnected = false;
    let connectedHostInfo = null;
    let versionDismissed = false;

    const versionBanner = document.getElementById('versionBanner');
    const versionBannerText = document.getElementById('versionBannerText');
    const versionRefreshBtn = document.getElementById('versionRefreshBtn');
    const versionDismissBtn = document.getElementById('versionDismissBtn');

    function getVersionStatus(backendVersion) {
      if (backendVersion === null || backendVersion === undefined) {
        return { compatible: true, state: 'unknown', message: '' };
      }
      if (backendVersion < FRONTEND_API_VERSION) {
        return {
          compatible: false,
          state: 'backend-outdated',
          message: `Backend outdated (API v${backendVersion}, frontend expects v${FRONTEND_API_VERSION}) — update tbx-terminal-deck.js on your Mac.`
        };
      }
      if (backendVersion > FRONTEND_API_VERSION) {
        return {
          compatible: false,
          state: 'frontend-outdated',
          message: `Frontend outdated (API v${FRONTEND_API_VERSION}, backend is v${backendVersion}) — refresh this page or update your frontend.`
        };
      }
      return { compatible: true, state: 'ok', message: `API v${backendVersion}` };
    }

    function updateVersionBanner(backendVersion) {
      if (!versionBanner || !versionBannerText) return;
      const status = getVersionStatus(backendVersion);
      if (status.compatible || versionDismissed) {
        versionBanner.hidden = true;
      } else {
        versionBannerText.textContent = `⚠️ ${status.message}`;
        if (versionRefreshBtn) {
          versionRefreshBtn.hidden = status.state !== 'frontend-outdated';
        }
        versionBanner.hidden = false;
      }
      handleResize();
    }

    if (versionRefreshBtn) {
      versionRefreshBtn.addEventListener('click', () => window.location.reload());
    }
    if (versionDismissBtn) {
      versionDismissBtn.addEventListener('click', () => {
        versionDismissed = true;
        if (versionBanner) versionBanner.hidden = true;
        handleResize();
      });
    }

    function isMobileDevice() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);
    }

    function saveHostAndReload(nextHost) {
      const normalized = normalizeHostUrl(nextHost);
      try {
        if (normalized) {
          localStorage.setItem('terminal_deck_host', normalized);
          saveHostEntry(normalized);
        } else {
          localStorage.removeItem('terminal_deck_host');
        }
      } catch (e) {}
      const url = new URL(window.location.href);
      url.searchParams.delete('host');
      window.location.href = url.toString();
    }

    function renderDisconnectedOnboarding() {
      if (hasConnectedOnce || currentWindows.length > 0) return;
      const emptyState = spatialStage.querySelector('.empty-state');
      if (!emptyState || emptyState.querySelector('.onboarding-card')) return;

      const targetLabel = apiBase || window.location.origin;
      const mobile = isMobileDevice();
      const otherSavedHosts = loadSavedHosts().filter(h => h.url !== getEffectiveHostUrl());
      const title = mobile
        ? '📱 Open on your Mac first'
        : '💻 Local daemon not detected';
      const body = mobile
        ? 'Terminal Deck needs the local Mac daemon running. Open this page on your Mac to start it, or scan the mobile QR code from your Mac.'
        : `Could not reach Terminal Deck at ${escapeHtml(targetLabel)}. Run the local script on your Mac to stream Terminal.app windows here:`;

      emptyState.innerHTML = `
        <div class="onboarding-card">
          <h2>${title}</h2>
          <p>${body}</p>
          ${mobile ? '' : `
            <div class="onboarding-cmd">
              <code>./tbx-terminal-deck.js</code>
              <button type="button" class="header-btn" id="copyCmdBtn">Copy</button>
            </div>
            <div class="onboarding-actions">
              <a class="onboarding-link" href="https://github.com/TarasMazepa/tbx-for-toolbox.dev/blob/main/tbx-terminal-deck.js" target="_blank" rel="noopener">View tbx-terminal-deck.js on GitHub ↗</a>
            </div>
          `}
          <div class="onboarding-host-row">
            <input type="text" class="onboarding-input" id="hostInput" value="${escapeHtml(apiBase)}" placeholder="http://localhost:8999">
            <button type="button" class="header-btn" id="hostSaveBtn">Connect</button>
            ${rawHost ? '<button type="button" class="header-btn" id="hostResetBtn">Reset</button>' : ''}
            ${otherSavedHosts.length ? `<button type="button" class="header-btn" id="onboardingHostsBtn">Hosts (${otherSavedHosts.length})</button>` : ''}
          </div>
        </div>
      `;

      const copyBtn = document.getElementById('copyCmdBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText('./tbx-terminal-deck.js');
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
          } catch (e) {}
        });
      }

      const hostInput = document.getElementById('hostInput');
      const hostSaveBtn = document.getElementById('hostSaveBtn');
      if (hostSaveBtn && hostInput) {
        hostSaveBtn.addEventListener('click', () => saveHostAndReload(hostInput.value));
        hostInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') saveHostAndReload(hostInput.value);
        });
      }

      const hostResetBtn = document.getElementById('hostResetBtn');
      if (hostResetBtn) {
        hostResetBtn.addEventListener('click', () => saveHostAndReload(''));
      }

      const onboardingHostsBtn = document.getElementById('onboardingHostsBtn');
      if (onboardingHostsBtn) {
        onboardingHostsBtn.addEventListener('click', openHostsModal);
      }
    }

    async function fetchConnectedHostInfo() {
      const effectiveUrl = getEffectiveHostUrl();
      try {
        const res = await fetch(`${apiBase}/info`);
        if (!res.ok) return;
        const info = await res.json();
        const backendVersion = typeof info.apiVersion === 'number' ? info.apiVersion : 0;
        connectedHostInfo = { ...info, apiVersion: backendVersion };
        saveHostEntry(effectiveUrl, {
          hostname: info.hostname || '',
          apiVersion: backendVersion,
          lastConnectedAt: Date.now(),
        });
        updateVersionBanner(backendVersion);
        if (hostsModal && !hostsModal.hidden) renderHostsModal();
      } catch (e) {}
    }

    function connectSSE() {
      const evtSource = new EventSource(`${apiBase}/events`);

      evtSource.onopen = () => {
        hasConnectedOnce = true;
        isSseConnected = true;
        statusDot.className = 'status-dot online';
        statusText.textContent = 'Live';
        enableKeepAwake();
        saveHostEntry(getEffectiveHostUrl(), { lastConnectedAt: Date.now() });
        fetchConnectedHostInfo();
        if (hostsModal && !hostsModal.hidden) renderHostsModal();
      };

      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data && data.type === 'key_status') {
            setKeyDispatchStage(data.windowId, data.stage);
            return;
          }
          if (data && !Array.isArray(data) && typeof data.apiVersion === 'number' && !connectedHostInfo) {
            updateVersionBanner(data.apiVersion);
          }
          currentWindows = Array.isArray(data) ? data : (data && data.windows ? data.windows : []);
          currentDisplays = Array.isArray(data) ? [] : (data && data.displays ? data.displays : []);
          renderSpatialLayout(currentWindows, currentDisplays);
          checkAutoAccept(currentWindows);
        } catch (e) {
          console.error('Error parsing SSE data', e);
        }
      };

      evtSource.onerror = () => {
        isSseConnected = false;
        statusDot.className = 'status-dot';
        statusText.textContent = 'Reconnecting';
        renderDisconnectedOnboarding();
        if (hostsModal && !hostsModal.hidden) renderHostsModal();
        evtSource.close();
        setTimeout(connectSSE, 2000);
      };
    }

    connectSSE();

    // API Hosts modal
    const hostsBtn = document.getElementById('hostsBtn');
    const hostsModal = document.getElementById('hostsModal');
    const hostsSummary = document.getElementById('hostsSummary');
    const hostsList = document.getElementById('hostsList');
    const modalHostInput = document.getElementById('modalHostInput');
    const modalHostConnectBtn = document.getElementById('modalHostConnectBtn');
    const hostsCloseBtn = document.getElementById('hostsCloseBtn');
    const hostProbeResults = new Map();

    async function probeHost(url) {
      hostProbeResults.set(url, { status: 'checking' });
      renderHostsList();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500);
      try {
        const res = await fetch(`${url}/info`, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) {
          hostProbeResults.set(url, { status: 'offline' });
        } else {
          const info = await res.json();
          const apiVersion = typeof info.apiVersion === 'number' ? info.apiVersion : 0;
          const hostname = info.hostname || '';
          hostProbeResults.set(url, { status: 'online', apiVersion, hostname });
          saveHostEntry(url, { hostname, apiVersion });
        }
      } catch (e) {
        clearTimeout(timer);
        hostProbeResults.set(url, { status: 'offline' });
      }
      if (hostsModal && !hostsModal.hidden) renderHostsList();
    }

    function renderHostsSummary() {
      if (!hostsSummary) return;
      const effectiveUrl = getEffectiveHostUrl();
      const stateLabel = isSseConnected ? 'Connected (Live)' : 'Disconnected';
      const backendVersion = connectedHostInfo ? connectedHostInfo.apiVersion : null;
      const verStatus = getVersionStatus(backendVersion);
      const versionBadge = backendVersion === null
        ? `Frontend API v${FRONTEND_API_VERSION}`
        : (verStatus.compatible
          ? `<span class="host-item-badge ok">API v${backendVersion} (Up to date)</span>`
          : `<span class="host-item-badge warn">${escapeHtml(verStatus.state === 'backend-outdated' ? `Backend v${backendVersion} < v${FRONTEND_API_VERSION}` : `Frontend v${FRONTEND_API_VERSION} < v${backendVersion}`)}</span>`);

      hostsSummary.innerHTML = `
        <div class="hosts-summary-row">
          <span>Current host</span>
          <span>${stateLabel}</span>
        </div>
        <div class="hosts-summary-row">
          <span class="hosts-summary-url">${escapeHtml(effectiveUrl)}</span>
          <span>${versionBadge}</span>
        </div>
      `;
    }

    function renderHostsList() {
      if (!hostsList) return;
      const effectiveUrl = getEffectiveHostUrl();
      const saved = loadSavedHosts();
      if (!saved.some(h => h.url === effectiveUrl)) {
        saved.unshift({
          url: effectiveUrl,
          hostname: connectedHostInfo && connectedHostInfo.hostname ? connectedHostInfo.hostname : '',
          apiVersion: connectedHostInfo ? connectedHostInfo.apiVersion : null,
          lastConnectedAt: 0,
        });
      }

      if (saved.length === 0) {
        hostsList.innerHTML = '<div class="hosts-empty">No saved hosts yet.</div>';
        return;
      }

      hostsList.innerHTML = '';
      for (const host of saved) {
        const isActive = host.url === effectiveUrl;
        const probe = hostProbeResults.get(host.url);
        let dotClass = 'status-dot';
        if (isActive) {
          dotClass = isSseConnected ? 'status-dot online' : 'status-dot';
        } else if (probe) {
          if (probe.status === 'online') dotClass = 'status-dot online';
          else if (probe.status === 'checking') dotClass = 'status-dot checking';
        }

        const displayVersion = isActive && connectedHostInfo
          ? connectedHostInfo.apiVersion
          : (probe && typeof probe.apiVersion === 'number' ? probe.apiVersion : host.apiVersion);
        const displayName = (isActive && connectedHostInfo && connectedHostInfo.hostname)
          || (probe && probe.hostname)
          || host.hostname
          || host.url;

        const verStatus = getVersionStatus(displayVersion);
        const verBadgeHtml = typeof displayVersion === 'number'
          ? `<span class="host-item-badge ${verStatus.compatible ? 'ok' : 'warn'}">API v${displayVersion}</span>`
          : '';

        const row = document.createElement('div');
        row.className = `host-item${isActive ? ' is-active' : ''}`;
        row.innerHTML = `
          <div class="host-item-main">
            <div class="${dotClass}"></div>
            <div class="host-item-info">
              <div class="host-item-title">
                <span>${escapeHtml(displayName)}</span>
                ${verBadgeHtml}
              </div>
              <div class="host-item-url">${escapeHtml(host.url)}</div>
            </div>
          </div>
          <div class="host-item-actions">
            ${isActive
              ? `<span class="host-item-badge ${isSseConnected ? 'ok' : ''}">${isSseConnected ? 'Connected' : 'Active'}</span>`
              : `<button type="button" class="header-btn host-switch-btn">Switch</button>
                 <button type="button" class="header-btn host-remove-btn" title="Remove host">✕</button>`}
          </div>
        `;

        const switchBtn = row.querySelector('.host-switch-btn');
        if (switchBtn) {
          switchBtn.addEventListener('click', () => saveHostAndReload(host.url));
        }
        const removeBtn = row.querySelector('.host-remove-btn');
        if (removeBtn) {
          removeBtn.addEventListener('click', () => {
            removeSavedHost(host.url);
            hostProbeResults.delete(host.url);
            renderHostsList();
          });
        }
        hostsList.appendChild(row);
      }
    }

    function renderHostsModal() {
      renderHostsSummary();
      renderHostsList();
    }

    function openHostsModal() {
      if (!hostsModal) return;
      hostsModal.hidden = false;
      renderHostsModal();
      const effectiveUrl = getEffectiveHostUrl();
      for (const host of loadSavedHosts()) {
        if (host.url !== effectiveUrl) {
          probeHost(host.url);
        }
      }
    }

    function closeHostsModal() {
      if (hostsModal) hostsModal.hidden = true;
    }

    if (hostsBtn) hostsBtn.addEventListener('click', openHostsModal);
    if (hostsCloseBtn) hostsCloseBtn.addEventListener('click', closeHostsModal);
    if (hostsModal) {
      hostsModal.addEventListener('click', (e) => {
        if (e.target === hostsModal) closeHostsModal();
      });
    }
    if (modalHostConnectBtn && modalHostInput) {
      modalHostConnectBtn.addEventListener('click', () => {
        if (modalHostInput.value.trim()) saveHostAndReload(modalHostInput.value);
      });
      modalHostInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && modalHostInput.value.trim()) {
          saveHostAndReload(modalHostInput.value);
        }
      });
    }

    // Mobile QR modal
    const qrBtn = document.getElementById('qrBtn');
    const qrModal = document.getElementById('qrModal');
    const qrImg = document.getElementById('qrImg');
    const qrUrlText = document.getElementById('qrUrlText');
    const qrCopyBtn = document.getElementById('qrCopyBtn');
    const qrCloseBtn = document.getElementById('qrCloseBtn');

    async function openQrModal() {
      if (!qrModal || !qrImg) return;
      qrImg.src = `${apiBase}/qr.svg?t=${Date.now()}`;
      qrModal.hidden = false;
      try {
        const res = await fetch(`${apiBase}/info`);
        if (res.ok) {
          const info = await res.json();
          if (qrUrlText) qrUrlText.textContent = info.phoneUrl || info.localUrl;
        }
      } catch (e) {
        if (qrUrlText) qrUrlText.textContent = 'Daemon unavailable';
      }
    }

    function closeQrModal() {
      if (qrModal) qrModal.hidden = true;
    }

    if (qrBtn) qrBtn.addEventListener('click', openQrModal);
    if (qrCloseBtn) qrCloseBtn.addEventListener('click', closeQrModal);
    if (qrModal) {
      qrModal.addEventListener('click', (e) => {
        if (e.target === qrModal) closeQrModal();
      });
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (qrModal && !qrModal.hidden) closeQrModal();
        if (hostsModal && !hostsModal.hidden) closeHostsModal();
      }
    });
    if (qrCopyBtn && qrUrlText) {
      qrCopyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(qrUrlText.textContent);
          qrCopyBtn.textContent = 'Copied!';
          setTimeout(() => { qrCopyBtn.textContent = 'Copy'; }, 1500);
        } catch (e) {}
      });
    }

    if (urlParams.get('qr') === '1' && !isMobileDevice()) {
      openQrModal();
    }
  </script>
</body>
</html>
