<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terminal Spatial Controller</title>
  <style>
    :root {
      --bg: #040711;
      --card-bg: #0c1427;
      --card-border: #1e293b;
      --card-active-border: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --enter-btn: #16a34a;
      --enter-btn-active: #15803d;
      --action-btn: #1e293b;
      --action-btn-active: #334155;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 4px) 12px 4px 12px;
      background: #090e1a;
      border-bottom: 1px solid var(--card-border);
      z-index: 2000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .header-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 9999px;
      background: #1e293b;
      color: var(--text-muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Per-Terminal Auto-Accept Animation & Header Pill */
    @keyframes pulse-auto-accept {
      0%, 100% {
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.35), inset 0 0 6px rgba(245, 158, 11, 0.12);
        border-color: #d97706;
      }
      50% {
        box-shadow: 0 0 18px rgba(245, 158, 11, 0.8), inset 0 0 12px rgba(245, 158, 11, 0.25);
        border-color: #fbbf24;
      }
    }
    button.card-auto-btn {
      flex: 0 0 auto;
      min-height: 0;
      padding: 2px 6px;
      font-size: 0.62rem;
      font-weight: 800;
      border-radius: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #64748b;
    }
    button.card-auto-btn.active {
      background: #451a03;
      border-color: #f59e0b;
      color: #fbbf24;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
    }
    button.dock-enter-btn.auto-accept,
    button.inline-enter-btn.auto-accept {
      background: #1c1808;
      border-color: #f59e0b;
      color: #fbbf24;
      animation: pulse-auto-accept 1.8s infinite ease-in-out;
    }

    /* Header Pill Button (overrides global keypad button sizing) */
    button.header-btn {
      flex: 0 0 auto;
      min-height: 0;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 9999px;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      gap: 4px;
    }
    button.header-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #082f49;
    }
    body.immersive header {
      display: none;
    }
    .immersive-exit-btn {
      display: none;
      position: fixed;
      top: calc(var(--safe-top) + 6px);
      right: 8px;
      z-index: 3000;
      opacity: 0.75;
    }
    body.immersive .immersive-exit-btn {
      display: flex;
    }

    /* Spatial Viewport */
    .viewport-container {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      padding: 6px 6px calc(var(--safe-bottom) + 6px) 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .spatial-stage {
      position: relative;
      background: #070c18;
      border: 1px solid #1a253c;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Multi-Monitor Background Guides */
    .monitors-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .monitor-panel {
      position: absolute;
      border: 1px dashed rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
      background: rgba(12, 20, 39, 0.2);
    }
    .monitor-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.62rem;
      font-weight: 800;
      color: rgba(148, 163, 184, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Individual Spatial Terminal Window Box */
    .spatial-window {
      position: absolute;
      padding: 3px;
      transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 10;
    }
    .window-card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      overflow: hidden;
    }
    .window-content {
      order: 1;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Focused Window State */
    .spatial-window.active .window-card {
      border-color: var(--card-active-border);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    /* ACTION REQUIRED STATE (LIT UP! Colorful & Glowing Amber Pulse) */
    @keyframes pulse-amber {
      0%, 100% {
        box-shadow: 0 0 16px rgba(245, 158, 11, 0.55), inset 0 0 14px rgba(245, 158, 11, 0.15);
        border-color: #f59e0b;
      }
      50% {
        box-shadow: 0 0 32px rgba(245, 158, 11, 0.95), inset 0 0 22px rgba(245, 158, 11, 0.3);
        border-color: #fbbf24;
      }
    }
    .spatial-window.action-required .window-card {
      border-color: #f59e0b !important;
      background: #141320;
      animation: pulse-amber 1.8s infinite ease-in-out;
    }

    /* Card Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .window-title {
      font-size: clamp(0.92rem, 1.9vw, 1.25rem);
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .header-badges {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .state-badge {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .state-badge.badge-amber {
      background: #b45309;
      color: #fef3c7;
      border: 1px solid #f59e0b;
    }
    .state-badge.badge-blue {
      background: #0369a1;
      color: #e0f2fe;
    }
    .state-badge.badge-green {
      background: #15803d;
      color: #dcfce7;
    }
    .active-badge {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 4px;
      background: #0284c7;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    /* Terminal Live Text Buffer Preview */
    .terminal-preview {
      margin: 2px 0 6px 0;
      padding: 6px 8px;
      background: #050814;
      border: 1px solid #1a253c;
      border-radius: 8px;
      font-family: ui-monospace, "SF Mono", "Fira Code", Menlo, monospace;
      font-size: clamp(0.62rem, 1.15vw, 0.78rem);
      line-height: 1.28;
      color: #a5f3fc;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1 1 0;
      min-height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .spatial-window.action-required .terminal-preview {
      border-color: rgba(245, 158, 11, 0.5);
      background: #0a0a16;
      color: #fef08a;
    }

    /* BUTTON PAD: CRISP, VIBRANT & READABLE AT ALL TIMES */
    .button-pad {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
      flex-shrink: 0;
      opacity: 0.95;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    .spatial-window.active .button-pad {
      opacity: 1;
    }

    /* LIT UP State (when action IS required - full colorful & vibrant!) */
    .spatial-window.action-required .button-pad {
      opacity: 1 !important;
      filter: none !important;
    }

    .button-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    button {
      touch-action: manipulation;
      font-family: inherit;
      border: none;
      border-radius: 9px;
      color: #ffffff;
      background: var(--action-btn);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, background 0.1s, box-shadow 0.2s;
      outline: none;
      font-weight: 700;
      padding: clamp(6px, 1vh, 10px) 4px;
      font-size: clamp(0.72rem, 1.5vw, 1.15rem);
      flex: 1;
      min-height: clamp(32px, 4vh, 42px);
    }
    button:active {
      transform: scale(0.93);
      background: var(--action-btn-active);
    }

    /* Button Colors */
    button.btn-enter {
      background: var(--enter-btn);
      font-size: clamp(0.85rem, 1.8vw, 1.3rem);
      font-weight: 800;
      flex: 1.8;
      min-height: clamp(34px, 4.2vh, 44px);
    }
    button.btn-enter:active {
      background: var(--enter-btn-active);
    }
    /* Glowing pulsing Enter button on action required */
    @keyframes pulse-enter {
      0%, 100% {
        box-shadow: 0 0 12px rgba(22, 163, 74, 0.6);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 24px rgba(22, 163, 74, 0.95);
        transform: scale(1.02);
      }
    }
    .spatial-window.action-required button.btn-enter {
      box-shadow: 0 0 16px rgba(22, 163, 74, 0.8);
      animation: pulse-enter 1.6s infinite ease-in-out;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 16px;
    }

    .onboarding-card {
      max-width: 460px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      text-align: left;
      color: var(--text);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      user-select: text;
      -webkit-user-select: text;
    }
    .onboarding-card h2 {
      margin: 0 0 8px 0;
      font-size: 1.05rem;
      color: var(--accent);
    }
    .onboarding-card p {
      margin: 0 0 12px 0;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--text-muted);
    }
    .onboarding-cmd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #020617;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      color: #e2e8f0;
    }
    .onboarding-cmd code {
      overflow-x: auto;
      white-space: nowrap;
    }
    .onboarding-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .onboarding-link {
      color: var(--accent);
      font-size: 0.84rem;
      text-decoration: none;
    }
    .onboarding-link:hover {
      text-decoration: underline;
    }
    .onboarding-host-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }
    .onboarding-input {
      flex: 1 1 0;
      min-width: 0;
      background: #020617;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Workspace & Movable Enter Dock */
    .workspace-main {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workspace-main[data-dock="top"] {
      flex-direction: column;
    }
    .workspace-main[data-dock="left"],
    .workspace-main[data-dock="right"] {
      flex-direction: row;
    }
    .workspace-main .viewport-container {
      order: 1;
    }
    .enter-dock {
      flex: 0 0 auto;
      order: 2;
      display: flex;
      align-items: stretch;
      gap: 6px;
      padding: 6px 8px calc(var(--safe-bottom) + 6px) 8px;
      background: #090e1a;
      border-top: 1px solid var(--card-border);
      z-index: 2000;
    }
    .workspace-main[data-dock="top"] .enter-dock {
      order: 0;
      padding: 6px 8px;
      border-top: none;
      border-bottom: 1px solid var(--card-border);
    }
    .workspace-main[data-dock="left"] .enter-dock,
    .workspace-main[data-dock="right"] .enter-dock {
      flex-direction: column;
      width: clamp(56px, 11vw, 86px);
      padding: 4px;
      gap: 4px;
      border-top: none;
    }
    .workspace-main[data-dock="inline"] .enter-dock,
    .workspace-main[data-dock="edge"] .enter-dock {
      display: none;
    }
    .workspace-main[data-dock="left"] .enter-dock {
      order: 0;
      border-right: 1px solid var(--card-border);
    }
    .workspace-main[data-dock="right"] .enter-dock {
      order: 2;
      border-left: 1px solid var(--card-border);
    }
    .enter-dock:empty {
      display: none;
    }
    button.dock-enter-btn {
      flex: 1 1 0;
      min-width: 0;
      min-height: clamp(42px, 5.5vh, 54px);
      padding: 6px 8px;
      border-radius: 10px;
      background: #111c33;
      border: 1px solid #1e293b;
      border-top: 3px solid var(--win-color, var(--enter-btn));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #ffffff;
    }
    .workspace-main[data-dock="top"] button.dock-enter-btn {
      border-top: 1px solid #1e293b;
      border-bottom: 3px solid var(--win-color, var(--enter-btn));
    }
    .workspace-main[data-dock="left"] button.dock-enter-btn {
      border-top: 1px solid #1e293b;
      border-right: 3px solid var(--win-color, var(--enter-btn));
      min-height: 0;
      padding: 4px 3px;
    }
    .workspace-main[data-dock="right"] button.dock-enter-btn {
      border-top: 1px solid #1e293b;
      border-left: 3px solid var(--win-color, var(--enter-btn));
      min-height: 0;
      padding: 4px 3px;
    }
    .workspace-main[data-dock="left"] .dock-btn-label,
    .workspace-main[data-dock="right"] .dock-btn-label {
      font-size: clamp(0.56rem, 1.05vw, 0.7rem);
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.15;
    }
    button.inline-enter-btn {
      display: none;
      flex: 0 0 auto;
      width: 100%;
      margin-top: 4px;
      background: #111c33;
      border: 1px solid #1e293b;
      border-top: 3px solid var(--win-color, var(--enter-btn));
      color: #cbd5e1;
      font-size: clamp(0.8rem, 1.6vw, 1.15rem);
      font-weight: 800;
      min-height: clamp(32px, 4vh, 42px);
    }
    .workspace-main[data-dock="inline"] button.inline-enter-btn,
    .workspace-main[data-dock="edge"] button.inline-enter-btn {
      display: flex;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="top"] .window-card {
      flex-direction: column;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="top"] button.inline-enter-btn {
      order: 0;
      width: 100%;
      min-height: clamp(28px, 18%, 48px);
      margin-top: 0;
      margin-bottom: 4px;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="bottom"] .window-card {
      flex-direction: column;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="bottom"] button.inline-enter-btn {
      order: 2;
      width: 100%;
      min-height: clamp(28px, 18%, 48px);
      margin-top: 4px;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="left"] .window-card,
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="right"] .window-card {
      flex-direction: row;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="left"] button.inline-enter-btn,
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="right"] button.inline-enter-btn {
      width: clamp(44px, 22%, 76px);
      height: 100%;
      min-height: 0;
      margin-top: 0;
      padding: 6px 4px;
      font-size: clamp(0.68rem, 1.25vw, 0.9rem);
      text-align: center;
      white-space: normal;
      line-height: 1.15;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="left"] button.inline-enter-btn {
      order: 0;
      margin-right: 4px;
    }
    .workspace-main[data-dock="edge"] .spatial-window[data-enter-side="right"] button.inline-enter-btn {
      order: 2;
      margin-left: 4px;
    }
    .spatial-window.action-required button.inline-enter-btn {
      background: var(--enter-btn);
      border-color: #4ade80;
      border-top-color: #fbbf24;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(22, 163, 74, 0.8);
      animation: pulse-enter 1.6s infinite ease-in-out;
    }
    button.inline-enter-btn.is-sending {
      background: #0369a1;
      animation: none;
    }
    button.inline-enter-btn.is-sent {
      background: #15803d;
      animation: none;
    }
    button.inline-enter-btn.is-error {
      background: #b91c1c;
      animation: none;
    }
    button.dock-enter-btn:active {
      transform: scale(0.95);
      background: #1e293b;
    }
    button.dock-enter-btn.action-required {
      background: var(--enter-btn);
      border-color: #4ade80;
      border-top-color: #fbbf24;
      box-shadow: 0 0 16px rgba(22, 163, 74, 0.8);
      animation: pulse-enter 1.6s infinite ease-in-out;
    }
    .dock-btn-label {
      width: 100%;
      font-size: clamp(0.65rem, 1.3vw, 0.8rem);
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    button.dock-enter-btn.action-required .dock-btn-label {
      color: #fef08a;
    }
    .dock-btn-action {
      font-size: clamp(0.82rem, 1.6vw, 1.1rem);
      font-weight: 800;
      color: #ffffff;
    }
    .window-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--win-color, var(--accent));
      flex-shrink: 0;
    }

    /* Visual SVG Connector Overlay */
    .connector-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1500;
    }
    @keyframes connector-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }
    .connector-path-sending {
      stroke-dasharray: 7 5;
      animation: connector-flow 0.45s linear infinite;
    }
    button.dock-enter-btn.is-sending {
      background: #0369a1;
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
      animation: none;
    }
    button.dock-enter-btn.is-sent {
      background: #15803d;
      border-color: #4ade80;
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.85);
      animation: none;
    }
    button.dock-enter-btn.is-error {

    .qr-modal-backdrop {
      position: fixed;
